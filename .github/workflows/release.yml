# Runs for version tags only (v0.1.0, ...): tests, release archives for every
# platform with checksums, and the container image on ghcr.io.
name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
      - name: Test
        run: go vet ./... && go test -race ./...
      - name: Build archives
        run: |
          version="${GITHUB_REF_NAME#v}"
          mkdir dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"
            arch="${target#*/}"
            dir="fsconsole_${version}_${os}_${arch}"
            ext=""
            if [ "$os" = windows ]; then ext=".exe"; fi
            mkdir "$dir"
            for cmd in fsconsole fsconsole-agent; do
              CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
                -ldflags "-s -w -X main.version=${version}" -o "$dir/$cmd$ext" "./cmd/$cmd"
            done
            cp LICENSE README.md README.zh-CN.md "$dir/"
            if [ "$os" = windows ]; then
              zip -qr "dist/$dir.zip" "$dir"
            else
              tar -czf "dist/$dir.tar.gz" "$dir"
            fi
          done
          cd dist && sha256sum * > checksums.txt
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --title "$GITHUB_REF_NAME" --generate-notes --verify-tag

  image:
    runs-on: ubuntu-latest
    needs: binaries
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - name: Version
        id: v
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ steps.v.outputs.version }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.v.outputs.version }}
            ghcr.io/${{ github.repository }}:latest
